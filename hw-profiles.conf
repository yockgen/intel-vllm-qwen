# hw-profiles.conf — hardware profile definitions for start.sh
#
# Profiles define default environment variables that apply when
# VLLM_HW_PROFILE=<name> is set (via env var or deploy.conf).
# Values only apply if not already set (same `:- ` semantics as start.sh).
#
# Format: profile_<name>_vars=(KEY=VALUE KEY=VALUE ...)
#
# Usage:
#   VLLM_HW_PROFILE=non-P2P ./start.sh
#   model mymodel ... VLLM_HW_PROFILE=non-P2P ... (in deploy.conf)

# Intel Core Ultra iGPU / Arc B70 — CCL simple-path thresholds prevent
# hangs in the SYCL collective backend during TP all-reduce operations.
profile_non_P2P_vars=(
  CCL_TOPO_P2P_ACCESS=0
  CCL_TOPO_FABRIC_VERTEX_CONNECTION_CHECK=0
  CCL_SYCL_ALLREDUCE_SIMPLE_THRESHOLD=4294967296
  CCL_SYCL_REDUCE_SCATTER_SIMPLE_THRESHOLD=4294967296
  CCL_SYCL_ALLGATHERV_SIMPLE_THRESHOLD=4294967296
  CCL_SYCL_ALLTOALL_TMP_BUF=1
)

# Add further profiles here, e.g.:
# profile_flex170_vars=(...)

