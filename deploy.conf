# deploy.conf — models managed by ./deploy.sh
#
# One `model` line per model. Format:
#
#     model  <name>  KEY=VALUE  KEY=VALUE  ...
#
#   <name>   A unique handle you invent. It is BOTH the argument you type
#            (e.g. `./deploy.sh up <name>`) AND the container name shown in
#            `docker ps`. Encode enough identity to tell variants apart —
#            family + size + any differentiator (quant, context) — so you can
#            run, say, two Qwen3 sizes side by side without a name clash:
#              qwen3.6-35b-a3b   qwen3-8b   gemma4-e4b-fp8   gemma4-e4b
#            Allowed chars: letters, digits, '.', '-', '_' (valid container name).
#   KEY=VALUE  Any environment variable that start.sh understands, passed
#            straight through. See README.md "Environment reference".
#            At minimum set HF_MODEL_ID and a unique VLLM_PORT per model.
#            Set VLLM_TENSOR_PARALLEL_SIZE explicitly per model to control GPU count.
#            You can also set ZE_AFFINITY_MASK per model to pin which GPU index(es)
#            are visible to that container, e.g. ZE_AFFINITY_MASK=0 or 0,1.
#
# GPU MEMORY: only ONE model runs at a time (deploy.sh stops the others before
# starting a new one), so each active model gets the whole GPU. Leave
# VLLM_GPU_MEMORY_UTILIZATION unset to use start.sh's full-GPU profile default.
# Only set it (e.g. =0.45 on every model) if you deliberately want two models
# resident at once — expect OOM on a single ~32 GiB Arc with large models.
#
# Gated models (e.g. google/gemma-*) need HF_TOKEN exported before `pull`/`up`.

model qwen3.6-35b-a3b  HF_MODEL_ID=Qwen/Qwen3.6-35B-A3B  VLLM_PORT=8000 VLLM_TENSOR_PARALLEL_SIZE=1

model gemma4-e4b       HF_MODEL_ID=google/gemma-4-E4B-it VLLM_PORT=8001 VLLM_QUANTIZATION= VLLM_TENSOR_PARALLEL_SIZE=1

# Examples — same family, different size/quant, unique name + port each:
# model qwen3-8b        HF_MODEL_ID=Qwen/Qwen3-8B          VLLM_PORT=8002 VLLM_TENSOR_PARALLEL_SIZE=1
# model gemma4-e4b-fp8  HF_MODEL_ID=leon-se/gemma-4-E4B-it-FP8-Dynamic VLLM_PORT=8003 VLLM_ALLOW_PREQUANT_FP8=1 VLLM_TENSOR_PARALLEL_SIZE=1
# model qwen3.6-35b-a3b-tp2-gpu01 HF_MODEL_ID=Qwen/Qwen3.6-35B-A3B VLLM_PORT=8004 VLLM_TENSOR_PARALLEL_SIZE=2 ZE_AFFINITY_MASK=0,1
# model qwen3.6-35b-a3b-tp2-ccl HF_MODEL_ID=Qwen/Qwen3.6-35B-A3B VLLM_PORT=8005 VLLM_TENSOR_PARALLEL_SIZE=2 ZE_AFFINITY_MASK=0,1 CCL_SYCL_ALLREDUCE_SIMPLE_THRESHOLD=4294967296 CCL_SYCL_REDUCE_SCATTER_SIMPLE_THRESHOLD=4294967296 CCL_SYCL_ALLGATHERV_SIMPLE_THRESHOLD=4294967296 CCL_SYCL_ALLTOALL_TMP_BUF=1
# model qwen3coder-30b-tools HF_MODEL_ID=Qwen/Qwen3-Coder-30B-A3B-Instruct VLLM_PORT=8006 VLLM_TENSOR_PARALLEL_SIZE=2 ZE_AFFINITY_MASK=0,1 VLLM_ENABLE_AUTO_TOOL_CHOICE=1 VLLM_TOOL_CALL_PARSER=qwen3coder
